[tool.poetry]
name = "sucoder"
version = "0.0.0"
description = "Tools for securely collaborating with an LLM agent via git mirrors."
authors = ["Ligon and Sue the Coder"]
license = "Apache-2.0"
readme = "README.org"
packages = [{ include = "sucoder" }]

[tool.poetry.dependencies]
python = "^3.9"
pyyaml = "^6.0"
typer = { version = ">=0.13,<1.0", extras = ["all"] }
click = ">=8.1,<9.0"
packaging = "^24.0"
qrcode = { version = ">=7.4,<9", optional = true }

[tool.poetry.extras]
remote-qr = ["qrcode"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.2"
pytest-xdist = "^3.5"
pytest-timeout = "^2.2"
mypy = "^1.18"
types-pyyaml = "^6.0"

[tool.poetry.scripts]
sucoder = "sucoder.cli:app"

[tool.mypy]
python_version = "3.11"
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
# Bound every test so a blocked subprocess (an emacs batch call or a network
# read in the dream/pilot tests) surfaces as a failure instead of hanging the
# run forever.  Generous enough for the slowest native-Org tests on a quiet
# host; tighten per-test with @pytest.mark.timeout where a lower bound is known.
timeout = 120
# Parallelize with `pytest -n auto`; left opt-in here so a bare `pytest` stays
# serial and reproducible for debugging.

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"
format-jinja = """
    {%- if distance == 0 -%}
        {{ base }}
    {%- else -%}
        {{ base }}.dev{{ distance }}+g{{ commit }}
    {%- endif -%}
"""

[tool.poetry-dynamic-versioning.substitution]
files = []

[build-system]
requires = ["poetry-core>=1.7.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
