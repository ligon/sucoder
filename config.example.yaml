human_user: <your-username>
agent_user: coder
agent_group: coder
mirror_root: /var/tmp/coder-mirrors
log_dir: /home/<your-username>/.sucoder/logs
system_prompt: /home/<your-username>/.sucoder/system_prompt.org

# Compliance audits (optional; defaults to off).
# When `auto_after_session: true`, sucoder runs the configured audit
# scope after every agent session and saves the report to
# <log_dir>/audits/<mirror>-<kind>-<timestamp>.log.  Failures are
# logged but never block session teardown.  The first run with no
# baseline does a full review; run `sucoder audit … --approve` once
# to seed `refs/audited` / `refs/audited-code`, after which subsequent
# auto-audits run in cheap diff mode.  See README § "Auditing →
# Auto-trigger after each session".
# audit:
#   auto_after_session: true
#   scope: all                  # skills | code | all

# Named execution targets for remote hosts (optional).
# Use --target/-T on the CLI to select one.
# targets:
#   savio:
#     gateway: hpc.brc.berkeley.edu
#     transfer_host: dtn.brc.berkeley.edu
#     mirror_root: ~/mirrors
#     # SSH connection-sharing knobs (all optional; defaults shown).
#     control_persist: 7d        # how long a warm ControlMaster lingers idle
#                                # (ssh time fmt: 7d, 12h, 90m...).  This is the
#                                # "tunnel stays open" lever.  Server-side idle
#                                # policy is the real ceiling; treat as best-effort.
#     keepalive_interval: 30     # ServerAliveInterval, seconds.  Keep short so the
#                                # probes also hold NAT/firewall mappings open.
#     keepalive_count_max: 120   # ServerAliveCountMax.  interval x count = the grace
#                                # budget before a stalled link is torn down
#                                # (30s x 120 = 1h; rides out a laptop nap).
#   # Compute-node target: allocates a SLURM node and tunnels through
#   # the login node (which only proxies TCP — no shell, no load).
#   savio-node:
#     gateway: hpc.brc.berkeley.edu
#     transfer_host: dtn.brc.berkeley.edu
#     mirror_root: ~/mirrors
#     control_persist: 7d
#     # Platform-specific prompt snippet appended to the base system prompt.
#     system_prompt_extra: ~/.sucoder/prompts/savio-node.org
#     slurm:
#       partition: savio3
#       account: fc_jevons
#       time: "02:00:00"
#       # qos: savio_normal  # optional
#       # local_disk: /local  # use compute-node local storage (bypasses Lustre)
#   # Shared-partition target: requests a fractional slice of an HTC node
#   # instead of an entire compute node.  Useful when an agent session
#   # only needs a few cores.
#   savio-htc:
#     gateway: hpc.brc.berkeley.edu
#     transfer_host: dtn.brc.berkeley.edu
#     mirror_root: ~/mirrors
#     control_persist: 24h
#     system_prompt_extra: ~/.sucoder/prompts/savio-node.org
#     slurm:
#       partition: savio4_htc
#       account: fc_jevons
#       qos: savio_normal
#       cpus_per_task: 4    # 4 cores out of the shared node
#       mem: 16G            # per-job memory (required on shared partitions)
#       time: "24:00:00"

# Mirrors are optional when using zero-config repo detection.
mirrors:
  sample:
    canonical_repo: /home/<your-username>/src/project.git
    mirror_name: project
    default_base_branch: main
    task_branch_prefix: task
    branch_prefixes:
      human: <your-username>
      agent: coder
    agent_launcher:
      # Default agent is claude; override with command: [codex] or command: [gemini].
      needs_yolo: true
      writable_dirs:
        - "~"
      flags:
        skills: "--skills {path}"
    # MCP servers available to the agent in this mirror (optional).
    # These are written to .sucoder-mcp.json and passed via --mcp-config.
    # Repos can also ship their own .mcp.json which Claude discovers natively.
    # mcp_servers:
    #   filesystem:
    #     command: npx
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
    #   github:
    #     command: npx
    #     args: ["-y", "@modelcontextprotocol/server-github"]
    #     env:
    #       GITHUB_TOKEN: "<token>"
